# ==========================================================
#  rclone.conf - konfigurasi remote untuk fitur backup
#
#  PENTING: kredensial asli milik penulis script sebelumnya
#  sudah dihapus agar tidak ikut tersebar.
#
#  Cara mengisi (jalankan di VPS-mu sendiri):
#      rclone config
#    -> n (new remote)
#    -> name: scvps
#    -> storage: drive (Google Drive)
#    -> ikuti instruksi sampai dapat token
#
#  Setelah selesai, rclone menulis token ke
#  ~/.config/rclone/rclone.conf - salin isinya ke file ini
#  bila script backup membutuhkan /root/rclone.conf.
# ==========================================================

[scvps]
type = drive
scope = drive
token = {"access_token":"ISI_TOKEN_ANDA","token_type":"Bearer","refresh_token":"ISI_REFRESH_TOKEN_ANDA","expiry":"1970-01-01T00:00:00.000000000+00:00"}
